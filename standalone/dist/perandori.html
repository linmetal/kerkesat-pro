<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070a">
<title>Perandori</title>
<meta name="description" content="Simulator karriere biznesi: vendime, rivalë, cikle ekonomike dhe nivele pa fund.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* One stylesheet for the standalone build. Same terminal language as the
   Next.js page, flattened out of the per-component style blocks. */

:root {
  --bg: #05070a;
  --panel: #0a0f15;
  --line: #16202b;
  --edge: #22303e;
  --text: #c9d4e0;
  --bright: #eef3f8;
  --dim: #5d6b7a;
  --dimmer: #33404d;
  --green: #38e08a;
  --amber: #f0b429;
  --red: #ff4d4d;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  /* Painted on body so it covers the whole canvas, however the page is hosted. */
  background:
    radial-gradient(1100px 600px at 50% -10%, rgba(56, 224, 138, 0.06), transparent 70%),
    repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.012) 0 1px, transparent 1px 3px),
    var(--bg);
}
#app { min-height: 100%; }

@keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes pulse { 50% { opacity: 0.55; } }

/* ------------------------------------------------------------------- boot */
.boot { padding: 18vh 8vw; font-size: 13px; color: var(--green); letter-spacing: 0.06em; }
.bootline { animation: fade 0.3s ease; margin-bottom: 8px; }
.cursor { display: inline-block; animation: blink 1s steps(1) infinite; color: var(--green); }

/* ------------------------------------------------------------- primitives */
.btn {
  font: inherit; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  background: #0d141c; color: var(--text); border: 1px solid var(--edge);
  padding: 9px 16px; cursor: pointer; transition: all 0.15s ease;
}
.btn:hover { border-color: var(--green); color: var(--green); }
.btn.primary { background: var(--green); color: #04160c; border-color: var(--green); font-weight: 600; }
.btn.primary:hover { background: #4df09b; color: #04160c; }
.btn.danger:hover { border-color: var(--red); color: var(--red); }
.wide { width: 100%; }
.big { padding: 16px; font-size: 12px; letter-spacing: 0.2em; }
.label { font-size: 9.5px; letter-spacing: 0.16em; color: var(--dim); text-transform: uppercase; }
.sep { height: 1px; background: var(--line); margin: 14px 0; }
.delta { font-size: 10px; margin-left: 6px; }
.delta.up { color: var(--green); }
.delta.down { color: #ff6b6b; }
.spark { width: 100%; height: 54px; display: block; }

.meter { margin-bottom: 10px; }
.meter-top { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.08em; color: #6b7a8b; margin-bottom: 4px; }
.meter-track { height: 4px; background: #131b24; overflow: hidden; }
.meter-fill { height: 100%; transition: width 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); }

/* ------------------------------------------------------------------- menu */
.menu { max-width: 820px; margin: 0 auto; padding: 56px 18px 80px; animation: fade 0.5s ease; }
.lang {
  position: fixed; top: 16px; right: 16px; font: inherit; font-size: 10px; letter-spacing: 0.14em;
  background: #0d141c; color: #6b7a8b; border: 1px solid var(--edge); padding: 6px 12px; cursor: pointer; z-index: 5;
}
.lang:hover { color: var(--green); border-color: var(--green); }
.brand { margin-bottom: 38px; }
.logo { font-size: clamp(30px, 7vw, 54px); font-weight: 600; letter-spacing: 0.22em; color: var(--bright); line-height: 1; }
.subtag { font-size: 10px; letter-spacing: 0.2em; color: var(--dim); margin-top: 12px; }
.block { margin: 26px 0; }
.block .label { display: block; margin-bottom: 10px; }
.input {
  font: inherit; width: 100%; background: var(--panel); border: 1px solid var(--edge);
  color: var(--bright); padding: 12px 14px; font-size: 16px;
}
.input:focus { outline: none; border-color: var(--green); }
.inds { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.indcard {
  font: inherit; text-align: left; background: var(--panel); border: 1px solid var(--line);
  color: var(--text); padding: 14px; cursor: pointer; transition: all 0.18s ease;
}
.indcard:hover { border-color: #2c3f52; transform: translateY(-2px); }
.indcard.on { border-color: var(--green); background: #0b1710; }
.ind-top { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
.icon { color: var(--green); font-size: 15px; }
.ind-name { font-size: 13px; letter-spacing: 0.06em; color: var(--bright); }
.indcard p { font-size: 11.5px; line-height: 1.65; color: #7b8b9c; margin: 0 0 10px; }
.ind-stats { display: flex; flex-wrap: wrap; gap: 10px; font-size: 9.5px; color: #4f5d6c; letter-spacing: 0.06em; }
.hof { width: 100%; border-collapse: collapse; font-size: 11px; }
.hof td { padding: 7px 8px; border-bottom: 1px solid #101820; }
.rk { color: var(--green); }
.dim { color: var(--dim); }
.num { text-align: right; color: var(--bright); }

/* ------------------------------------------------------------------ frame */
.app { max-width: 1400px; margin: 0 auto; padding: 0 14px 40px; }
.grid { display: grid; grid-template-columns: 272px minmax(0, 1fr) 292px; gap: 14px; align-items: start; }
.panel { background: linear-gradient(180deg, #0a0f15, #080c11); border: 1px solid var(--line); padding: 16px; }
.stage { min-height: 520px; display: flex; flex-direction: column; }

.hd { padding: 16px 2px 14px; }
.hd-main {
  display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--line); padding-bottom: 12px;
}
.nm { color: var(--bright); font-size: 13px; letter-spacing: 0.1em; }
.indname { color: #7b8b9c; font-size: 11px; }
.dot { color: #2c3f52; margin: 0 8px; }
.clock { font-size: 11px; color: #7b8b9c; letter-spacing: 0.08em; }
.clock b { color: var(--bright); font-weight: 500; }
.lvl, .lvl b { color: var(--green); }
.tools { display: flex; align-items: center; gap: 10px; }
.ecotag { font-size: 10px; letter-spacing: 0.14em; }
.mini {
  font: inherit; font-size: 9.5px; letter-spacing: 0.14em; background: transparent;
  color: var(--dim); border: 1px solid var(--edge); padding: 5px 10px; cursor: pointer;
}
.mini:hover { color: var(--red); border-color: var(--red); }
.warn { display: flex; flex-wrap: wrap; gap: 16px; padding: 8px 0 0; font-size: 10px; letter-spacing: 0.1em; color: var(--amber); }

/* ------------------------------------------------------------------ stats */
.nwbig { font-size: 25px; letter-spacing: 0.02em; margin: 6px 0 10px; }
.row { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; gap: 10px; }
.row .v { font-size: 12.5px; }
.mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; }
.mini-grid div { display: flex; flex-direction: column; gap: 3px; }
.mini-grid b { font-size: 13px; font-weight: 500; color: var(--bright); }
.foot { margin-top: 16px; font-size: 9px; letter-spacing: 0.12em; color: var(--dimmer); }
.people { display: flex; flex-direction: column; gap: 11px; margin-top: 8px; }
.pr-top { display: flex; justify-content: space-between; align-items: baseline; }
.pn { font-size: 12px; color: var(--bright); }
.pl { font-size: 11px; }
.pr-role { font-size: 9px; letter-spacing: 0.1em; color: #4f5d6c; margin: 3px 0 5px; }
.pr-track { height: 3px; background: #131b24; }
.pr-fill { height: 100%; transition: width 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); }

/* --------------------------------------------------------------- decision */
.dec, .out { animation: fade 0.35s ease; display: flex; flex-direction: column; flex: 1; }
.tagline { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; gap: 12px; }
.tag { font-size: 9px; letter-spacing: 0.22em; color: #04160c; background: var(--green); padding: 4px 10px; white-space: nowrap; }
.tag.alert { background: var(--red); color: #180404; animation: pulse 1.6s ease infinite; }
.tag.neutral { background: var(--edge); color: var(--text); }
.tag.good { background: var(--green); color: #04160c; }
.tag.bad { background: var(--red); color: #180404; }
.code { font-size: 9px; letter-spacing: 0.14em; color: #2c3f52; }
.stage h2 { font-size: clamp(19px, 2.6vw, 27px); font-weight: 500; color: var(--bright); margin: 0 0 14px; line-height: 1.3; }
.body { font-size: 14px; line-height: 1.85; color: #93a3b4; margin: 0 0 26px; max-width: 62ch; }
.opts { display: flex; flex-direction: column; gap: 9px; }
.opt {
  font: inherit; display: flex; gap: 14px; align-items: flex-start; text-align: left; width: 100%;
  background: var(--panel); border: 1px solid var(--line); color: var(--text);
  padding: 14px 16px; cursor: pointer; transition: all 0.16s ease;
}
.opt:hover { border-color: var(--green); background: #0b1710; transform: translateX(3px); }
.key { flex: 0 0 auto; width: 20px; height: 20px; display: grid; place-items: center; border: 1px solid var(--edge); font-size: 10px; color: var(--dim); }
.opt:hover .key { border-color: var(--green); color: var(--green); }
.txt { display: flex; flex-direction: column; gap: 5px; }
.lab { font-size: 13.5px; color: var(--bright); display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.hint { font-size: 11px; color: #6b7a8b; line-height: 1.6; }
.risk { font-style: normal; font-size: 9px; letter-spacing: 0.12em; color: var(--amber); border: 1px solid #4a3a12; padding: 2px 6px; }
.fin { font-style: normal; font-size: 9px; letter-spacing: 0.12em; color: #4dabf7; border: 1px solid #143050; padding: 2px 6px; }
.kbd { margin-top: auto; padding-top: 22px; font-size: 9px; letter-spacing: 0.14em; color: var(--dimmer); }

/* ---------------------------------------------------------------- outcome */
.lead { font-size: 15.5px; line-height: 1.95; color: var(--bright); margin: 0 0 18px; max-width: 62ch; }
.follow { font-size: 14px; line-height: 1.9; color: #93a3b4; margin: 0 0 18px; max-width: 62ch; border-left: 2px solid var(--edge); padding-left: 16px; }
.tierup { border: 1px solid var(--green); background: #0b1710; padding: 14px 16px; margin: 6px 0 20px; animation: fade 0.5s ease; }
.tl { font-size: 9px; letter-spacing: 0.22em; color: var(--green); margin-bottom: 6px; }
.tv { font-size: 16px; color: var(--bright); letter-spacing: 0.04em; }
.annual { border: 1px solid var(--edge); background: #090e14; padding: 14px 16px; margin: 4px 0 20px; animation: fade 0.5s ease; }
.an-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.an-tag { font-size: 9px; letter-spacing: 0.22em; color: #4dabf7; }
.an-year { font-size: 9px; letter-spacing: 0.14em; color: #2c3f52; }
.an-grid { display: flex; flex-wrap: wrap; gap: 18px 26px; }
.an-grid div { display: flex; flex-direction: column; gap: 4px; }
.an-grid b { font-size: 13px; font-weight: 500; color: var(--bright); }
.an-grid em { font-style: normal; font-size: 10px; }
.report { border-top: 1px solid var(--line); padding-top: 16px; margin-top: auto; }
.rgrid { display: flex; flex-wrap: wrap; gap: 26px; margin-top: 10px; }
.rgrid div { display: flex; flex-direction: column; gap: 4px; }
.rgrid b { font-size: 14px; font-weight: 500; }
.go { margin-top: 22px; align-self: flex-start; padding: 13px 26px; letter-spacing: 0.18em; }

/* ----------------------------------------------------------------- market */
.eco { border: 1px solid; padding: 11px 12px; margin-top: 8px; background: var(--panel); }
.eco-name { font-size: 13px; letter-spacing: 0.16em; margin-bottom: 8px; }
.eco-rows { display: flex; flex-direction: column; gap: 4px; font-size: 10px; color: var(--dim); }
.eco-rows b { color: var(--text); font-weight: 500; }
.rivals { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.rv { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 11px; padding: 6px 8px; background: var(--panel); border-left: 2px solid var(--edge); }
.rv.me { border-left-color: var(--green); }
.rv.me .rn { color: var(--green); }
.rn { color: var(--text); display: flex; flex-direction: column; gap: 2px; }
.rn em { font-style: normal; font-size: 9px; color: #4f5d6c; letter-spacing: 0.08em; }
.rvv { color: var(--bright); white-space: nowrap; }
.feed { display: flex; flex-direction: column; gap: 9px; margin-top: 8px; max-height: 340px; overflow-y: auto; }
.ln { font-size: 10.5px; line-height: 1.65; color: #7b8b9c; display: flex; gap: 8px; }
.stamp { color: var(--dimmer); flex: 0 0 auto; }
.ln.good { color: #7ee2ab; }
.ln.bad { color: #ff9a9a; }
.ln.econ { color: #9fc6f0; }
.ln.rival { color: #e0c27e; }
.feed::-webkit-scrollbar { width: 3px; }
.feed::-webkit-scrollbar-thumb { background: var(--edge); }

/* ------------------------------------------------------------------- over */
.over { max-width: 760px; margin: 0 auto; padding: 12vh 18px 80px; animation: fade 0.6s ease; }
.ttl { font-size: clamp(26px, 6vw, 46px); letter-spacing: 0.16em; color: var(--red); margin-bottom: 18px; font-weight: 600; }
.overtxt { font-size: 15px; line-height: 1.95; color: #93a3b4; margin: 0 0 36px; max-width: 58ch; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); }
.st { background: var(--panel); padding: 16px; display: flex; flex-direction: column; gap: 7px; }
.st b { font-size: 17px; font-weight: 500; }
.hl { display: block; margin: 40px 0 12px; }
.over .hof { margin-bottom: 36px; }
.over .hof tr.mine td { color: var(--green); }
.over .big { padding: 16px 34px; }

/* ------------------------------------------------------------------ modal */
.modal { position: fixed; inset: 0; background: rgba(2, 4, 7, 0.86); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 18px; }
.modal-box { background: var(--panel); border: 1px solid var(--edge); padding: 26px; max-width: 420px; }
.modal-box p { font-size: 13px; line-height: 1.7; margin: 0 0 20px; }
.modal-actions { display: flex; gap: 10px; }

/* ------------------------------------------------------------------ phone */
@media (max-width: 1020px) {
  .grid { grid-template-columns: 1fr; }
  .stage { min-height: 0; order: -1; }
}
@media (max-width: 620px) {
  .app { padding: 0 12px 32px; }
  .panel { padding: 14px; }
  .hd-main { gap: 8px 14px; }
  .clock { width: 100%; }
  .opt { padding: 13px 14px; }
  .lab { font-size: 14px; }
  .hint { font-size: 11.5px; }
  .body { font-size: 14.5px; }
  .kbd { display: none; }
  .go { width: 100%; text-align: center; }
  .feed { max-height: 260px; }
  .menu { padding: 40px 16px 60px; }
}

</style>
</head>

wo weeks off"),h("Humb vrull, fiton kok\xEB t\xEB kthjell\xEBt.","Lose momentum, gain a clear head."),{stress:-26,revMult:.96,morale:8},h("Bota nuk u shemb pa ty. Ky ishte m\xEBsimi m\xEB i shtrenjt\xEB dhe m\xEB i lir\xEB nj\xEBkoh\xEBsisht.","The world did not collapse without you. The most expensive and cheapest lesson at once.")),w(h("Delego gjith\xE7ka q\xEB mundesh","Delegate everything you can"),h("Kosto m\xEB e lart\xEB, kok\xEB m\xEB e lir\xEB.","Higher cost, lighter head."),{team:1,stress:-14,morale:6,cashU:-.6},h("T\xEB tjer\xEBt e b\xEBjn\xEB 80% aq mir\xEB sa ti. M\xEBson se 80% mjafton.","Others do it 80% as well as you. You learn that 80% is enough."))]}],Fe=mt;var o=(e,t)=>({sq:e,en:t}),v=(e,t,a,n,i={})=>({label:e,hint:t,fx:a,res:n,...i}),pt=[{id:"seed_round",stage:[1,6],once:!0,weight:8,req:e=>e.revenue>6e4&&e.equity>45,title:o("Raundi i investimit","The funding round"),body:o("Nj\xEB fond t\xEB ofron kapital serioz. Me t\xEB vjen bordi, raportet tremujore dhe pritshm\xEBria e rritjes 3x.","A fund offers you serious capital. With it comes a board, quarterly reports and the expectation of 3x growth."),opts:[v(o("Merr raundin e plot\xEB","Take the full round"),o("Karburant maksimal, pron\xEBsi e prer\xEB.","Maximum fuel, ownership cut."),{cashU:9,equity:-22,revMult:1.35,influence:14,valuation:1.25,stress:10,set:{hasBoard:!0}},o("Llogaria nuk ka qen\xEB kurr\xEB kaq e plot\xEB. Dhe kurr\xEB nuk ke pasur kaq pak liri.","The account has never been this full. And you have never had this little freedom.")),v(o("Raund i vog\xEBl","Small round"),o("Mjaftuesh\xEBm p\xEBr t\xEB ecur, pa humbur timonin.","Enough to move, without losing the wheel."),{cashU:3.5,equity:-9,revMult:1.14,influence:6,valuation:1.08},o("Merr sa t\xEB duhet, jo sa t\xEB ofrohet. Disiplin\xEB e rrall\xEB.","You take what you need, not what is offered. Rare discipline.")),v(o("Financo rritjen me fitim","Fund growth from profit"),o("E ngadalt\xEB. E jotja.","Slow. Yours."),{revMult:1.04,rep:6,stress:6,set:{proudlyIndependent:!0}},o("Rritesh me ritmin q\xEB lejon xhepi. Konkurrent\xEBt shkojn\xEB m\xEB shpejt \u2014 p\xEBr tani.","You grow at the speed your pocket allows. Competitors move faster \u2014 for now."))]},{id:"key_exec",stage:[2,8],once:!0,weight:7,req:e=>e.teamSize>=5,title:o("Drejtuesi i dyt\xEB","The number two"),body:o("Kompania \xEBsht\xEB shum\xEB e madhe q\xEB ta mbash n\xEB kok\xEB. Duhet dikush q\xEB vendos kur ti nuk je aty.","The company is too big to hold in your head. You need someone who decides when you are not in the room."),opts:[v(o("Sill dik\xEB nga jasht\xEB","Hire from outside"),o("P\xEBrvoj\xEB e provuar, kultur\xEB e tronditur.","Proven experience, shaken culture."),{cashU:-2,revMult:1.18,morale:-8,stress:-14,costMult:1.08},o("Sjell sisteme q\xEB funksionojn\xEB dhe nj\xEB m\xEBnyr\xEB pune q\xEB ekipi nuk e njeh.","They bring systems that work and a way of working the team does not recognise.")),v(o("Ngrite dik\xEB nga brenda","Promote from within"),o("Besnik\xEBri dhe moral, boshll\xEBk p\xEBrvoje.","Loyalty and morale, an experience gap."),{revMult:1.08,morale:16,rep:4,stress:-8},o("Ekipi sheh se rritja \xEBsht\xEB e mundur k\xEBtu. Gabimet vijn\xEB \u2014 por vijn\xEB me zem\xEBr.","The team sees that growth is possible here. They make mistakes, but they make them with heart.")),v(o("Mbaj gjith\xE7ka vet\xEB","Keep it all yourself"),o("Kontroll, me \xE7mimin e kok\xEBs t\xEBnde.","Control, at the cost of your head."),{stress:20,revMult:.98,morale:-6},o("Asgj\xEB nuk l\xEBviz pa miratimin t\xEBnd. P\xEBrfshir\xEB gj\xEBrat q\xEB s'duhej t\xEB prisnin.","Nothing moves without your approval. Including the things that should not have waited."))]},{id:"expand_geo",stage:[2,9],weight:6,req:e=>e.revenue>25e4,title:o("Tregu i dyt\xEB","The second market"),body:o("Rritja n\xEB sht\xEBpi po ngadal\xEBsohet. P\xEBrtej kufirit ka treg \u2014 dhe rregulla q\xEB nuk i njeh.","Growth at home is slowing. Across the border there is a market \u2014 and rules you do not know."),opts:[v(o("Hap plot\xEBsisht","Full launch"),o("Investim i madh, rritje e madhe ose humbje e madhe.","Big spend, big growth or big loss."),{cashU:-3.5,fixedCostU:1.2,stress:10},o("Ekipi i ri nis pun\xEBn n\xEB nj\xEB qytet ku askush nuk e njeh mark\xEBn t\xEBnde.","A new team starts work in a city where nobody knows your brand."),{risk:{p:.38,bad:{fx:{revU:-.5,rep:-6,cashU:-1.2},res:o("Tregu nuk reagoi. Mbyll pas n\xEBnt\xEB muajsh dhe m\xEBson sa kushton arroganca.","The market did not respond. You shut it after nine months and learn what arrogance costs.")},good:{fx:{revU:2.6,influence:10,valuation:1.15},res:o("Funksionon m\xEB mir\xEB se n\xEB sht\xEBpi. Tani je kompani me shum\xEB tregje.","It works better than home. You are now a multi-market company.")}}}),v(o("Hyr me partner lokal","Enter with a local partner"),o("M\xEB pak fitim, shum\xEB m\xEB pak rrezik.","Less profit, far less risk."),{revU:1.2,marginAdd:-.04,influence:6,rep:4},o("Ata njohin \xE7do der\xEB. Ti paguan p\xEBr k\xEBt\xEB njohuri \u2014 dhe ia vlen.","They know every door. You pay for that knowledge \u2014 and it is worth it.")),v(o("P\xEBrqendrohu n\xEB sht\xEBpi","Double down at home"),o("Thell\xEBsi n\xEB vend t\xEB gjer\xEBsis\xEB.","Depth instead of breadth."),{marginAdd:.05,revMult:1.06,rep:4,stress:-4},o("B\xEBhesh i paz\xEBvend\xEBsuesh\xEBm aty ku je, n\xEB vend q\xEB t\xEB jesh mediok\xEBr n\xEB dy vende.","You become irreplaceable where you are, instead of mediocre in two places."))]},{id:"quality_crisis",stage:[1,9],weight:6,req:e=>e.revenue>12e4,title:o("Defekti","The defect"),body:o("Di\xE7ka nuk shkoi mir\xEB n\xEB nj\xEB pjes\xEB t\xEB mir\xEB t\xEB porosive. Askush jasht\xEB kompanis\xEB nuk e ka v\xEBn\xEB re ende.","Something went wrong across a good chunk of orders. Nobody outside the company has noticed yet."),opts:[v(o("Njoftoje publikisht dhe z\xEBvend\xEBso","Announce it and replace"),o("Kosto e menj\xEBhershme, besim afatgjat\xEB.","Immediate cost, long-term trust."),{cashU:-2,rep:16,morale:10,valuation:1.06},o("Doli lajmi p\xEBr m\xEBnyr\xEBn si e trajtove. Kthehet si klient\xEB q\xEB nuk largohen kurr\xEB.","The story became how you handled it. It comes back as customers who never leave.")),v(o("Rregulloje n\xEB heshtje","Fix it quietly"),o("Kosto e ul\xEBt, bomb\xEB me sahat.","Low cost, ticking clock."),{cashU:-.4,stress:8},o("Rregullohet pa zhurm\xEB. P\xEBr momentin.","It gets fixed without noise. For now."),{risk:{p:.4,bad:{fx:{rep:-22,revMult:.88,stress:12},res:o('Dikush nga brenda flet. Lajmi del jasht\xEB me fjal\xEBn "fshehje".','Someone inside talks. The story breaks with the word "cover-up" in it.')},good:{fx:{cashU:.2},res:o("Askush s'e mori vesh. Ti e di. Kjo mjafton p\xEBr sonte.","Nobody found out. You know. That is enough for tonight.")}}}),v(o("Faj\xEBso furnitorin","Blame the supplier"),o("Shp\xEBton buxhetin, humbet zinxhirin.","Saves the budget, breaks the chain."),{rep:-6,cashU:.3,marginAdd:-.03,morale:-8},o("Furnitori nuk t\xEB beson m\xEB dhe kushtet p\xEBrkeq\xEBsohen. Fitove tremujorin, humbe partnerin.","The supplier stops trusting you and the terms get worse. You won the quarter, lost the partner."))]},{id:"leverage",stage:[2,10],weight:6,req:e=>e.revenue>2e5&&e.rep>35,title:o("Lev\xEB financiare","Leverage"),body:o("Banka t\xEB ofron kapital t\xEB lir\xEB p\xEBr zgjerim. Borxhi shum\xEBzon gjith\xE7ka \u2014 fitimin dhe gabimin nj\xEBlloj.","The bank offers cheap capital for expansion. Debt multiplies everything \u2014 profit and error alike."),opts:[v(o("Merr borxh t\xEB r\xEBnd\xEB","Take heavy debt"),o("Rritje e p\xEBrshpejtuar, mbijetes\xEB e brisht\xEB.","Accelerated growth, fragile survival."),{debtU:8,cashU:8,revMult:1.3,stress:14,set:{levered:!0}},o("Rritesh dyfish m\xEB shpejt. N\xEB kriz\xEBn e ardhshme, edhe bie dyfish m\xEB shpejt.","You grow twice as fast. In the next crisis, you fall twice as fast too.")),v(o("Borxh i matur","Measured debt"),o("Ekuilib\xEBr i m\xEBrzitsh\xEBm dhe i men\xE7ur.","A boring, wise balance."),{debtU:3,cashU:3,revMult:1.12},o("Sa duhet, jo sa mundesh. Bankier\xEBt zhg\xEBnjehen leht\xEB.","As much as needed, not as much as possible. Bankers are easily disappointed.")),v(o("Shlyej borxhin ekzistues","Pay down existing debt"),o("Fle nat\xEBn. Rritesh ngadal\xEB.","You sleep at night. You grow slowly."),{cashU:-3,debtClear:.6,stress:-12,rep:5},o("Bilanci b\xEBhet i past\xEBr. N\xEB kriz\xEB, kjo do t\xEB jet\xEB arma jote m\xEB e mir\xEB.","The balance sheet gets clean. In a crisis, that will be your best weapon."))]},{id:"systems",stage:[2,10],once:!0,weight:6,req:e=>e.teamSize>=8,title:o("Sistemet","Systems"),body:o("Kompania funksionon sepse njer\xEBzit mbajn\xEB mend gj\xEBra. Kjo nuk shkall\xEBzohet.","The company works because people remember things. That does not scale."),opts:[v(o("Investim i madh n\xEB procese","Invest heavily in process"),o("Ngadal\xEBson sot, shum\xEBzon nes\xEBr.","Slows today, multiplies tomorrow."),{cashU:-2.5,marginAdd:.08,revMult:.97,valuation:1.18,morale:-4,set:{systemized:!0}},o("Gjasht\xEB muaj ankesa. Pastaj kompania nis t\xEB punoj\xEB edhe kur ti je me pushime.","Six months of complaints. Then the company starts working even while you are on holiday.")),v(o("Automatizo pjes\xEBt e lodhshme","Automate the boring parts"),o("Kosto m\xEB e ul\xEBt, ekip m\xEB i vog\xEBl.","Lower cost, smaller team."),{cashU:-1.2,marginAdd:.05,team:-1,morale:-6},o("Dy role zhduken. Njer\xEBzit e kuptojn\xEB se \xE7far\xEB do t\xEB thot\xEB kjo p\xEBr ta.","Two roles disappear. People understand what that means for them.")),v(o("Vazhdo me kaos","Stay chaotic"),o("Shpejt\xEBsi tani, mur m\xEB von\xEB.","Speed now, a wall later."),{revMult:1.05,stress:10,marginAdd:-.02},o("Ende shpejt. Por \xE7do punonj\xEBs i ri k\xEBrkon dy muaj p\xEBr t\xEB kuptuar si funksionon gjith\xE7ka.","Still fast. But every new hire needs two months to understand how anything works."))]},{id:"bad_apple",stage:[1,10],weight:5,req:e=>e.teamSize>=6,title:o("Ylli toksik","The toxic star"),body:o("Personi yt m\xEB produktiv po shkat\xEBrron moralin e gjith\xEB ekipit. Numrat jan\xEB t\xEB pamohuesh\xEBm.","Your most productive employee is destroying the morale of everyone else. Their numbers are undeniable."),opts:[v(o("Largoje menj\xEBher\xEB","Fire them now"),o("Humbje e menj\xEBhershme, aj\xEBr i past\xEBr.","Immediate loss, clean air."),{revMult:.93,morale:20,rep:6},o("T\xEB nes\xEBrmen ekipi punon ndryshe. Dikush t\xEB thot\xEB faleminderit n\xEB korridor.","The next day the team works differently. Someone thanks you in the corridor.")),v(o("Mbaje p\xEBr numrat","Keep them for the numbers"),o("Rezultate sot, ekip i thyer nes\xEBr.","Results today, broken team tomorrow."),{revMult:1.06,morale:-18,rep:-4},o("Numrat mbahen. Dy nga njer\xEBzit e tu m\xEB t\xEB mir\xEB nisin t\xEB k\xEBrkojn\xEB pun\xEB tjet\xEBr.","The numbers hold. Two of your best people quietly start job hunting.")),v(o("Konfrontim dhe kufij","Confront and set limits"),o("Zgjidhje e v\xEBshtir\xEB, rezultat i pasigurt.","Hard path, uncertain result."),{stress:8},o("E ul n\xEB tavolin\xEB dhe i thua gjith\xE7ka drejtp\xEBrdrejt.","You sit them down and say all of it directly."),{risk:{p:.45,bad:{fx:{revMult:.9,morale:-6},res:o("Largohet i ofenduar dhe merr dy klient\xEB me vete.","They leave offended and take two clients with them.")},good:{fx:{morale:14,revMult:1.03,rep:5},res:o("Ndryshon v\xEBrtet. Rrall\xEB ndodh \u2014 por ndodhi.","They change. It rarely happens \u2014 but it happened.")}}})]},{id:"tax_scheme",stage:[2,11],once:!0,weight:5,req:e=>e.revenue>4e5,title:o("Struktura e zgjuar","The clever structure"),body:o("Nj\xEB konsulent t\xEB tregon nj\xEB struktur\xEB q\xEB ul taksat n\xEB m\xEBnyr\xEB dramatike. Ligjore. N\xEB let\xEBr.","A consultant shows you a structure that slashes your tax bill. Legal. On paper."),opts:[v(o("Zbatoje","Implement it"),o("Para t\xEB shumta, ekspozim publik.","Serious money, public exposure."),{marginAdd:.08,cashU:2,influence:4},o("Fitimi neto k\xEBrcen ndjesh\xEBm. Dosja ekziston diku.","Net profit jumps sharply. The file exists somewhere."),{risk:{p:.33,bad:{fx:{rep:-26,cashU:-4,stress:16,marginAdd:-.08},res:o("Nj\xEB gazetar e gjen struktur\xEBn. Titulli t\xEB ndjek p\xEBr vite.","A journalist finds the structure. The headline follows you for years.")},good:{fx:{cashU:1.5},res:o("Askush nuk pyeti. Parat\xEB mbet\xEBn n\xEB llogari.","Nobody asked. The money stayed in the account.")}}}),v(o("Vet\xEBm optimizimi i thjesht\xEB","Simple optimisation only"),o("Fitim modest, gjum\xEB i qet\xEB.","Modest gain, quiet sleep."),{marginAdd:.02,rep:4},o("B\xEBn at\xEB q\xEB b\xEBn \xE7do kompani serioze dhe asgj\xEB m\xEB shum\xEB.","You do what every serious company does and nothing more.")),v(o("Paguaj gjith\xE7ka dhe trumbetoje","Pay in full and say so publicly"),o("Kosto reale, kapital reputacioni.","Real cost, reputational capital."),{marginAdd:-.02,rep:14,influence:8},o("B\xEBhesh shembulli q\xEB citohet. Kjo hap dyer politike q\xEB parat\xEB nuk i hapin.","You become the example people cite. That opens political doors money cannot."))]},{id:"corporate_partner",stage:[3,10],weight:5,req:e=>e.revenue>6e5,title:o("Gjiganti troket","The giant knocks"),body:o("Nj\xEB korporat\xEB e madhe do t\xEB integroj\xEB produktin t\xEBnd. Kontrata \xEBsht\xEB e shk\xEBlqyer dhe t\xEB lidh duart.","A large corporation wants to integrate your product. The contract is excellent and it ties your hands."),opts:[v(o("N\xEBnshkruaj marr\xEBveshjen e madhe","Sign the big one"),o("Rritje e fort\xEB, var\xEBsi strategjike.","Strong growth, strategic dependency."),{revU:3,marginAdd:-.05,influence:12,valuation:1.12,set:{dependent:!0}},o("T\xEB ardhurat trefishohen nga nj\xEB burim i vet\xEBm. Fuqia negociuese kalon tek ata.","Revenue triples from a single source. The negotiating power moves to them.")),v(o("Negocio ashp\xEBr","Negotiate hard"),o("Rrezikon marr\xEBveshjen p\xEBr kushte m\xEB t\xEB mira.","Risks the deal for better terms."),{stress:8},o("Ti k\xEBrkon m\xEB shum\xEB se sa presin.","You ask for more than they expect."),{risk:{p:.42,bad:{fx:{rep:-4,influence:-4},res:o("Ata largohen nga tavolina. Ti mbetesh me krenarin\xEB dhe pa kontrat\xEB.","They walk from the table. You keep your pride and no contract.")},good:{fx:{revU:2.6,marginAdd:.02,rep:10,influence:10},res:o("Ata pranojn\xEB. Nga sot t\xEB trajtojn\xEB si t\xEB barabart\xEB.","They accept. From today they treat you as an equal.")}}}),v(o("Refuzo dhe konkurro","Refuse and compete"),o("Rrug\xEB e v\xEBshtir\xEB, kompani e pavarur.","Hard road, independent company."),{rep:8,morale:10,stress:10,revMult:1.03},o("Ekipi u ngrit n\xEB k\xEBmb\xEB kur e d\xEBgjoi. Tani duhet t\xEB provoni se kishit t\xEB drejt\xEB.","The team stood up when they heard. Now you have to prove you were right."))]},{id:"lawsuit",stage:[2,11],weight:5,req:e=>e.revenue>3e5,title:o("Padia","The lawsuit"),body:o("Dikush t\xEB padit. Nuk ka r\xEBnd\xEBsi n\xEBse ke t\xEB drejt\xEB \u2014 ka r\xEBnd\xEBsi sa gjat\xEB mund t\xEB paguash avokat\xEBt.","Someone is suing you. Being right does not matter \u2014 how long you can pay lawyers does."),opts:[v(o("Lufto deri n\xEB fund","Fight it to the end"),o("E shtrenjt\xEB, parimore.","Expensive, principled."),{cashU:-2.5,stress:14},o("Hyn n\xEB gjyq me bindjen se ke t\xEB drejt\xEB.","You go to court convinced you are right."),{risk:{p:.4,bad:{fx:{cashU:-3,rep:-12},res:o("Humbet. Paguan d\xEBmin dhe shpenzimet e pal\xEBs tjet\xEBr.","You lose. You pay damages and their costs too.")},good:{fx:{rep:14,influence:8},res:o("Fiton. Tregu m\xEBson se ti nuk paguan p\xEBr t\xEB heshtur.","You win. The market learns you do not pay to make things go away.")}}}),v(o("Marr\xEBveshje jasht\xEB gjykat\xEBs","Settle quietly"),o("Kosto e sigurt, pa titull gazete.","Certain cost, no headlines."),{cashU:-1.6,rep:-3,stress:-6},o("Paguan dhe mbaron. \xCBsht\xEB zgjidhja e m\xEBrzitshme dhe zakonisht e sakt\xEB.","You pay and it ends. The boring answer, and usually the right one."))]},{id:"mentor",stage:[1,8],once:!0,weight:5,title:o("Mentori","The mentor"),body:o("Dikush q\xEB e ka nd\xEBrtuar dhe humbur nj\xEB perandori t\xEB ofron koh\xEBn e vet. N\xEB k\xEBmbim k\xEBrkon sinqeritet total.","Someone who built and lost an empire offers you their time. In exchange they want total honesty."),opts:[v(o("Prano dhe d\xEBgjo","Accept and listen"),o("Gabime m\xEB pak, ego m\xEB e vog\xEBl.","Fewer mistakes, smaller ego."),{influence:10,rep:6,stress:-10,revMult:1.06,join:{mentor:{loyalty:70}},set:{hasMentor:!0}},o("T\xEB thot\xEB tri gj\xEBra q\xEB nuk doje t'i d\xEBgjoje. T\xEB treja rezultojn\xEB t\xEB v\xEBrteta.","They tell you three things you did not want to hear. All three turn out true."),{queue:[{id:"arc_mentor_call",in:9}]}),v(o("Prano dhe jepi 2%","Accept and give 2%"),o("Angazhim i v\xEBrtet\xEB nga ana e vet.","Real skin in the game for them."),{equity:-2,influence:16,revMult:1.1,valuation:1.08,join:{mentor:{loyalty:85}},set:{hasMentor:!0}},o("Tani merr telefon p\xEBr ty edhe pa ia k\xEBrkuar. Rrjeti q\xEB ka nd\xEBrtuar b\xEBhet i yti.","Now they make calls for you unasked. Their network becomes yours."),{queue:[{id:"arc_mentor_call",in:7}]}),v(o("Nuk kam koh\xEB","No time for that"),o("Vazhdon vet\xEBm.","You carry on alone."),{stress:4,influence:-2},o("M\xEBson gjith\xE7ka vet\xEB, ngadal\xEB dhe shtrenjt\xEB.","You learn everything yourself, slowly and expensively."))]},{id:"second_line",stage:[2,10],weight:6,req:e=>e.revenue>4e5,title:o("Linja e dyt\xEB","The second line"),body:o("Nj\xEB produkt i vet\xEBm \xEBsht\xEB nj\xEB pik\xEB d\xEBshtimi e vetme. Por fokusi \xEBsht\xEB arsyeja pse ke arritur deri k\xEBtu.","A single product is a single point of failure. But focus is the reason you got this far."),opts:[v(o("Nis linj\xEBn e dyt\xEB","Launch a second line"),o("Diversifikim, v\xEBmendje e ndar\xEB.","Diversification, split attention."),{cashU:-2,revU:1.6,stress:8,marginAdd:-.02},o("Dy biznese n\xEBn nj\xEB \xE7ati. T\xEB dyja k\xEBrkojn\xEB drejtuesin m\xEB t\xEB mir\xEB q\xEB ke.","Two businesses under one roof. Both want the best operator you have.")),v(o("Thellohu n\xEB nj\xEB gj\xEB","Go deeper on one thing"),o("Dominim i ngusht\xEB.","Narrow dominance."),{marginAdd:.07,revMult:1.1,rep:8,valuation:1.1},o("B\xEBhesh emri i par\xEB q\xEB p\xEBrmendet n\xEB kategorin\xEB t\xEBnde. Kjo vlen m\xEB shum\xEB se nj\xEB linj\xEB e dyt\xEB mediokre.","You become the first name mentioned in your category. Worth more than a mediocre second line.")),v(o("Blej nj\xEB konkurrent t\xEB vog\xEBl","Buy a small competitor"),o("Rritje e bler\xEB, integrim i dhimbsh\xEBm.","Bought growth, painful integration."),{cashU:-4,revU:2.2,team:4,morale:-8,influence:6},o("Marrja e kompanis\xEB zgjat nj\xEB jav\xEB. Bashkimi i dy kulturave zgjat dy vjet.","Buying the company takes a week. Merging two cultures takes two years."))]}],_e=pt;var r=(e,t)=>({sq:e,en:t}),g=(e,t,a,n,i={})=>({label:e,hint:t,fx:a,res:n,...i}),ct=[{id:"ipo",stage:[5,12],once:!0,weight:8,req:e=>e.revenue>8e6&&e.rep>45,title:r("Bursa","The public markets"),body:r("Bankier\xEBt thon\xEB se je gati. Dalja n\xEB burs\xEB do t\xEB thot\xEB kapital pa fund dhe nj\xEB audienc\xEB q\xEB t\xEB gjykon \xE7do tremujor.","The bankers say you are ready. Going public means endless capital and an audience that judges you every quarter."),opts:[g(r("Dil n\xEB burs\xEB","Go public"),r("Likuiditet masiv, liri e humbur.","Massive liquidity, freedom lost."),{cashU:14,equity:-25,valuation:1.5,influence:25,rep:14,stress:14,multipleAdd:2,set:{public:!0}},r("Zilja bie dhe numri n\xEB ekran b\xEBhet publik. Ti nuk je m\xEB pronar \u2014 je menaxher i pritshm\xEBrive.","The bell rings and the number on the screen becomes public. You are no longer an owner \u2014 you manage expectations.")),g(r("Mbetu privat","Stay private"),r("M\xEB pak para, shum\xEB m\xEB shum\xEB kontroll.","Less money, far more control."),{rep:8,morale:8,stress:-8,valuation:1.05},r("U thua jo dhe gazetat shkruajn\xEB p\xEBr t\xEB. Ekipi yt e lexon me krenari.","You say no and the press writes about it. Your team reads it with pride.")),g(r("Shit shumic\xEBn e aksioneve","Sell the majority"),r("Dalje me para n\xEB dor\xEB. Fund i nj\xEB kapitulli.","Cash out. The end of a chapter."),{cashU:20,equity:-55,influence:10,stress:-25},r("N\xEBnshkrimi zgjat dhjet\xEB sekonda. Pas tij, kompania vazhdon pa ty n\xEB timon.","The signature takes ten seconds. After it, the company carries on without you at the wheel."))]},{id:"acquire_rival",stage:[5,12],weight:7,req:e=>e.rivals.some(t=>t.alive)&&e.cash>0,title:r("Blerja e rivalit","Buying the rival"),body:r("Nj\xEB nga konkurrent\xEBt e tu \xEBsht\xEB i lodhur dhe i hapur ndaj ofertave. Blerja e tij t\xEB jep treg \u2014 dhe problemet e tij.","One of your competitors is tired and open to offers. Buying them gives you market \u2014 and their problems."),opts:[g(r("Blej me para n\xEB dor\xEB","Buy with cash"),r("E shtrenjt\xEB, e past\xEBr.","Expensive, clean."),{cashU:-9,revU:3.2,team:8,influence:12,morale:-6,set:{acquirer:!0}},r("N\xEBnshkruani n\xEB nj\xEB sall\xEB t\xEB ftoht\xEB. Emri i tyre zhduket nga tregu brenda gjasht\xEB muajsh.","You sign in a cold room. Their name disappears from the market within six months.")),g(r("Blej me aksione","Buy with stock"),r("Ruan cash-in, holl pron\xEBsin\xEB.","Preserves cash, dilutes you."),{equity:-12,revU:3.4,team:8,valuation:1.1,influence:10},r("Nuk preke llogarin\xEB. Por tani ish-rivali yt ulet n\xEB bordin t\xEBnd.","You did not touch the bank account. But your former rival now sits on your board.")),g(r("L\xEBri t\xEB shemben vet\xEB","Let them collapse"),r("Durim. Rrezik se dikush tjet\xEBr i blen.","Patience. Risk that someone else buys them."),{cashU:.5,stress:-4},r("Ti pret. N\xEB k\xEBt\xEB loj\xEB durimi \xEBsht\xEB gjithashtu strategji.","You wait. In this game patience is also a strategy."))]},{id:"diversify",stage:[6,12],weight:6,req:e=>e.cash>0&&e.revenue>2e7,title:r("Perandoria me shum\xEB krer\xEB","The many-headed empire"),body:r("Ke para q\xEB nuk punojn\xEB. Mund t\xEB nd\xEBrtosh nj\xEB grup q\xEB prek disa industri \u2014 ose t\xEB mbetesh mjesht\xEBr i nj\xEB zanati.","You have money that is not working. You can build a group that touches several industries \u2014 or stay master of one craft."),opts:[g(r("Nd\xEBrto holdingun","Build the holding group"),r("Stabilitet n\xEBp\xEBr cikle, fokus i holluar.","Stability across cycles, diluted focus."),{cashU:-8,revU:2.4,multipleAdd:-.5,influence:18,valuation:1.1,set:{holding:!0}},r("Tani kur nj\xEB sektor bie, nj\xEB tjet\xEBr t\xEB mban. Asnj\xEBri nuk t\xEB njeh si m\xEB t\xEB mirin.","When one sector falls, another holds you up. None of them knows you as the best.")),g(r("Blej pasuri t\xEB paluajtshme","Buy real assets"),r("Mburoj\xEB ndaj krizave, rritje e ngadalt\xEB.","Crisis armour, slow growth."),{cashU:-6,fixedCostU:-.8,rep:6,set:{assetsHedge:!0}},r("Nd\xEBrtesat nuk rriten shpejt. Por as nuk zhduken kur tregu \xE7mendet.","Buildings do not grow fast. They also do not vanish when the market loses its mind.")),g(r("Rishp\xEBrndaj gjith\xE7ka n\xEB biznesin baz\xEB","Reinvest all into the core"),r("Bast total mbi vetveten.","A total bet on yourself."),{cashU:-7,revMult:1.3,valuation:1.15,stress:8},r("Vendos gjith\xE7ka aty ku e njeh loj\xEBn m\xEB mir\xEB se kushdo. N\xEBse gabon, gabon i madh.","You put everything where you know the game better than anyone. If you are wrong, you are wrong big."))]},{id:"lobby",stage:[6,12],once:!0,weight:5,req:e=>e.influence>40,title:r("Korridoret e pushtetit","The corridors of power"),body:r("Nj\xEB rregullore e re mund ta ndryshoj\xEB industrin\xEB t\xEBnde. Ti ke tani mjaft ndikim sa t\xEB ndikosh mbi t\xEB.","A new regulation could reshape your industry. You now have enough influence to shape it."),opts:[g(r("Lobo agresivisht","Lobby aggressively"),r("Avantazh strukturor, ekspozim etik.","Structural advantage, ethical exposure."),{cashU:-3,influence:18},r("Takimet b\xEBhen pa d\xEBshmitar\xEB.","The meetings happen without witnesses."),{risk:{p:.35,bad:{fx:{rep:-24,stress:14,cashU:-2},res:r("Emri yt del n\xEB nj\xEB hetim. Gjith\xE7ka e nd\xEBrtuar ting\xEBllon papritur e ndotur.","Your name surfaces in an inquiry. Everything you built suddenly sounds dirty.")},good:{fx:{marginAdd:.07,revMult:1.18,influence:10},res:r("Rregullorja del ashtu si\xE7 e k\xEBrkove. Konkurrent\xEBt zgjohen n\xEB nj\xEB treg tjet\xEBr.","The regulation lands exactly as you asked. Competitors wake up in a different market.")}}}),g(r("Nd\xEBrto koalicion t\xEB hapur","Build an open coalition"),r("M\xEB e ngadalt\xEB, e q\xEBndrueshme.","Slower, durable."),{influence:12,rep:12,revMult:1.05},r("Bashkon industrin\xEB rreth nj\xEB standardi. B\xEBhesh z\xEBri i saj publik.","You unite the industry around a standard. You become its public voice.")),g(r("Rri larg politik\xEBs","Stay out of politics"),r("Past\xEBrti, pa mbrojtje.","Clean hands, no protection."),{rep:6,stress:-6},r("Rregullorja del pa ty. P\xEBrshtatesh, si gjithmon\xEB.","The regulation passes without you. You adapt, as always."))]},{id:"moonshot",stage:[6,12],weight:6,req:e=>e.cash>0&&e.revenue>15e6,title:r("Basti i madh","The moonshot"),body:r("Ekipi yt k\xEBrkimor ka di\xE7ka q\xEB mund ta ndryshoj\xEB industrin\xEB ose t\xEB djeg\xEB nj\xEB pjes\xEB t\xEB madhe t\xEB kapitalit.","Your research team has something that could redefine the industry or incinerate a large part of your capital."),opts:[g(r("Financo plot\xEBsisht","Fund it fully"),r("Mund\xEBsi historike, rrezik real.","Historic upside, real risk."),{cashU:-9,stress:12,morale:10},r("Vendos nj\xEB shum\xEB q\xEB t\xEB dhemb mbi di\xE7ka q\xEB ende nuk ekziston.","You put a painful amount of money behind something that does not exist yet."),{risk:{p:.45,bad:{fx:{cashU:-2,morale:-12,rep:-6},res:r("Tre vjet pun\xEB mbyllen me nj\xEB prezantim t\xEB heshtur. M\xEBson shum\xEB. Paguan m\xEB shum\xEB.","Three years of work end in a quiet presentation. You learn a lot. You pay more.")},good:{fx:{revMult:1.6,valuation:1.45,multipleAdd:2,rep:18,influence:14},res:r("Funksionon. Industria ndahet n\xEB para dhe pas k\xEBsaj dite.","It works. The industry splits into before and after this day.")}}}),g(r("Financo me partner","Fund it with a partner"),r("Rrezik i ndar\xEB, fitim i ndar\xEB.","Shared risk, shared reward."),{cashU:-3.5,equity:-5,valuation:1.12,revMult:1.12},r("Dikush tjet\xEBr mban gjysm\xEBn e rrezikut \u2014 dhe gjysm\xEBn e lavdis\xEB.","Someone else carries half the risk \u2014 and half the glory.")),g(r("Mbylle projektin","Kill the project"),r("Disiplin\xEB. Ndoshta edhe frik\xEB.","Discipline. Possibly fear."),{cashU:1.5,morale:-10,marginAdd:.03},r("Numrat duken m\xEB mir\xEB menj\xEBher\xEB. Dy nga studiuesit e tu japin dor\xEBheqjen brenda muajit.","The numbers improve immediately. Two of your researchers resign within the month."))]},{id:"succession",stage:[7,12],once:!0,weight:5,req:e=>e.year>12,title:r("Pasardh\xEBsi","Succession"),body:r("Je n\xEB kulm dhe i lodhur. Pyetja nuk \xEBsht\xEB n\xEBse do t\xEB dor\xEBzosh timonin, por kujt dhe kur.","You are at the top and tired. The question is not whether you hand over the wheel, but to whom and when."),opts:[g(r("Em\xEBro nj\xEB drejtues dhe rri n\xEB bord","Appoint a CEO, keep the board seat"),r("Liri pa humbur pron\xEBsin\xEB.","Freedom without losing ownership."),{stress:-30,revMult:1.06,morale:8,influence:6,set:{steppedBack:!0}},r("E shikon kompanin\xEB t\xEB ec\xEB pa ty. Dhemb dhe \xE7liron nj\xEBkoh\xEBsisht.","You watch the company move without you. It hurts and frees you at the same time.")),g(r("Vazhdo ti, si gjithmon\xEB","Keep running it yourself"),r("Kontroll total, trup i lodhur.","Total control, tired body."),{stress:16,revMult:1.08,rep:4},r("Askush nuk e drejton k\xEBt\xEB kompani si ti. Kjo \xEBsht\xEB edhe e v\xEBrtet\xEB, edhe problemi.","Nobody runs this company like you do. That is both true and the problem.")),g(r("T\xEBrhiqu plot\xEBsisht","Retire completely"),r("Fund i zgjedhur nga ti.","An ending you chose."),{},r("Mbyll der\xEBn nga jasht\xEB, p\xEBr her\xEB t\xEB par\xEB pa \xE7el\xEBsa.","You close the door from outside, keyless for the first time."),{end:"retired"})]},{id:"philanthropy",stage:[7,12],once:!0,weight:5,title:r("\xC7far\xEB mbetet pas teje","What outlives you"),body:r("Parat\xEB jan\xEB b\xEBr\xEB abstrakte. Tani pyetja \xEBsht\xEB se \xE7far\xEB emri l\xEB pas kur numrat nuk kan\xEB m\xEB r\xEBnd\xEBsi.","The money has become abstract. Now the question is what name you leave when the numbers stop mattering."),opts:[g(r("Themelo nj\xEB fondacion","Start a foundation"),r("Kapital jasht\xEB, reputacion brenda.","Capital out, reputation in."),{cashU:-6,rep:22,influence:16,stress:-10},r("Emri yt shkon mbi nd\xEBrtesa q\xEB nuk prodhojn\xEB asgj\xEB. \xCBsht\xEB investimi i par\xEB q\xEB nuk e mat n\xEB p\xEBrqindje.","Your name goes on buildings that produce nothing. The first investment you do not measure in percentages.")),g(r("Investo te njer\xEBzit e tu","Invest in your own people"),r("Kompani m\xEB e fort\xEB, zhurm\xEB m\xEB e vog\xEBl.","Stronger company, less noise."),{cashU:-3,morale:25,revMult:1.08,rep:8},r("Pagat, aksionet, shkollimi. Ekipi m\xEBson se besnik\xEBria shkon n\xEB t\xEB dy drejtimet.","Salaries, equity, education. The team learns that loyalty runs both ways.")),g(r("Asgj\xEB. Ende jo.","Nothing. Not yet."),r("Gjith\xE7ka mbetet kapital pune.","Everything stays working capital."),{cashU:1,rep:-6},r("Parat\xEB mbeten n\xEB loj\xEB. Disa e quajn\xEB disiplin\xEB, disa munges\xEB imagjinate.","The money stays in play. Some call it discipline, some a failure of imagination."))]}],yt=[{id:"tech_scale",stage:[2,10],industry:"tech",weight:7,title:r("B and")} stays as an owner, not an employee. Their division becomes the healthiest part of the business.`)),T(u("Barazo pag\xEBn dhe mbylle tem\xEBn","Match the salary and move on"),u("Zgjidhje e shpejt\xEB, e cek\xEBt.","Fast fix, shallow."),{costMult:1.08,loyalty:{hand:-8},morale:4},u("Pranon parat\xEB. Pyetja q\xEB b\xEBri nuk ishte p\xEBr parat\xEB.","They take the money. The question they asked was not about money."),{queue:[{id:"arc_hand_leave",in:6}]}),T(u("Uroju fat","Wish them luck"),u("Dor\xEBzim i sjellsh\xEBm.","A gracious surrender."),{leave:["hand"],team:-1,revMult:.95,rep:6,morale:-6},e=>u("I hap der\xEBn vet\xEB dhe e p\xEBrcjell. Ekipi e sheh se si ndahesh me njer\xEBzit \u2014 dhe kjo kujtohet.","You open the door yourself and walk them out. The team sees how you part with people \u2014 and that is remembered."))]},{id:"arc_hand_leave",once:!0,weight:0,req:e=>L(e,"hand")&&te(e,"hand")<55,title:e=>u(`${c(e,"hand")} jep dor\xEBheqjen`,`${c(e,"hand")} resigns`),body:e=>u(`Letra \xEBsht\xEB dy rreshta. ${c(e,"hand")} po hap di\xE7ka t\xEB veten \u2014 n\xEB tregun t\xEBnd, me njer\xEBz q\xEB i njeh me em\xEBr.`,`The letter is two lines long. ${c(e,"hand")} is starting something of their own \u2014 in your market, with people you know by name.`),opts:[T(u("Investo n\xEB kompanin\xEB e tyre","Invest in their company"),u("Kthen rivalin n\xEB partner.","Turns a rival into a partner."),{cashU:-3,influence:10,rep:8,leave:["hand"],revMult:.97},u("N\xEBse do t\xEB nd\xEBrtohet gjithsesi, m\xEB mir\xEB ta nd\xEBrtojn\xEB me parat\xEB e tua.","If it is going to be built anyway, better it is built with your money.")),T(u("Mbroje territorin","Defend the territory"),u("Kontrata, klauzola, avokat\xEB.","Contracts, clauses, lawyers."),{cashU:-1.2,rep:-8,morale:-10,leave:["hand"],spawnRivalFrom:"hand"},e=>u("I d\xEBrgon let\xEBr zyrtare dit\xEBn e dyt\xEB. Ata hapin gjithsesi \u2014 tani si armik.","You send a formal letter on day two. They launch anyway \u2014 now as an enemy.")),T(u("L\xEBri t\xEB shkojn\xEB, pa zhurm\xEB","Let them go quietly"),u("Pa kosto sot, konkurrent nes\xEBr.","No cost today, a competitor tomorrow."),{leave:["hand"],spawnRivalFrom:"hand",team:-2,revMult:.94,rep:4},u("Ndaheni mir\xEB. Brenda dy vitesh, emri i tyre \xEBsht\xEB n\xEB list\xEBn e rival\xEBve t\xEB tu.","You part well. Within two years their name is on your rival list."))]},{id:"arc_duel_open",stage:[2,11],weight:5,once:!0,req:e=>{let t=K(e);return!!t&&t.value>3e5&&e.revenue>25e4},title:e=>u(`${K(e).ceo} flet p\xEBr ty`,`${K(e).ceo} talks about you`),body:e=>{let t=K(e);return u(`N\xEB nj\xEB panel me gazetar\xEB, ${t.ceo} nga ${t.name} u pyet p\xEBr ty dhe buz\xEBqeshi: "Ata jan\xEB t\xEB vegj\xEBl. Ne i njohim t\xEB gjith\xEB t\xEB vegjlit." Salla qeshi.`,`On a panel with journalists, ${t.ceo} of ${t.name} was asked about you and smiled: "They are small. We know all the small ones." The room laughed.`)},opts:[T(u("P\xEBrgjigju publikisht","Answer in public"),u("V\xEBmendje e madhe, ekspozim i madh.","Big attention, big exposure."),{rep:6,influence:10,stress:8,set:{duel:!0}},u("P\xEBrgjigjja jote qarkullon m\xEB shum\xEB se deklarata e tyre. Tani t\xEB gjith\xEB presin rezultatin.","Your answer travels further than their statement. Now everyone waits for the scoreboard."),{queue:[{id:"arc_duel_close",in:9}]}),T(u("P\xEBrgjigju me numra, n\xEB heshtje","Answer with numbers, silently"),u("Pa zhurm\xEB, me rezultat.","No noise, just results."),{revMult:1.1,marginAdd:.03,stress:6,set:{duel:!0}},u("Nuk thua asgj\xEB. Vitin tjet\xEBr, t\xEB dh\xEBnat e tregut e thon\xEB p\xEBr ty.","You say nothing. Next year, the market data says it for you."),{queue:[{id:"arc_duel_close",in:9}]}),T(u("K\xEBrko nj\xEB takim privat","Ask for a private meeting"),u("Armiq\xEBsi e kthyer n\xEB marr\xEBveshje.","Hostility turned into an arrangement."),{influence:8,marginAdd:.02,rep:-2,set:{duel:!0,truce:!0}},e=>u("Hani dark\xEB pa d\xEBshmitar\xEB. Dilni me nj\xEB kufi
